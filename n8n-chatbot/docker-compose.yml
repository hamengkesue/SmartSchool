version: '3.8'


services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      WEBHOOK_URL: "https://ngrok-free.dev"
    volumes:
      - n8n_data_lama:/home/node/.n8n

volumes:
  n8n_data_lama:
    external: true
    name: project-root_n8n_data
